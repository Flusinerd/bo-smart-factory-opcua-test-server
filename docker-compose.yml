services:
  opcua:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4840:4840"
      - "8081:8081"
    environment:
      OPCUA_SERVER_CONFIG_PATH: /data/server-config.json
      OPCUA_HTTP_ADDR: ":8081"
      OPCUA_HTTP_WEB_ROOT: /app/web
      OPCUA_NAMESPACE_URI: ${OPCUA_NAMESPACE_URI:-}
    volumes:
      - opcua_config:/data

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      HTTP_ADDR: ":8080"
      OPCUA_TCP_BRIDGE_PORT: "9000"
      OPCUA_ENDPOINT: "opc.tcp://opcua:4840"
      OPCUA_NAMESPACE_URI: "urn:binary-sensors-demo"
    depends_on:
      - opcua

volumes:
  opcua_config:
